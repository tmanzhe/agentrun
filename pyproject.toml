[project]
name = "agentrun"
version = "0.1.0"
description = "Crash-resumable AI jobs backed by PostgreSQL"
readme = "README.md"
authors = [
    { name = "Truman Chan", email = "97918794+tmanzhe@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
agentrun = "agentrun:main"
agentrun-mcp = "agentrun.mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
